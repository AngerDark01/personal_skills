# Personal Agent Skills Registry
# Machine-readable index of all available skills.
# Agents: read this file to discover skills, then install selectively using scripts/install.sh
#
# Install a skill:
#   curl -fsSL https://raw.githubusercontent.com/AngerDark01/personal_skills/main/scripts/install.sh \
#     | bash -s -- <name>
#
# List all skills:
#   curl -fsSL https://raw.githubusercontent.com/AngerDark01/personal_skills/main/scripts/install.sh \
#     | bash -s -- --list

version: "1.0"
repo: "AngerDark01/personal_skills"
install_script: "https://raw.githubusercontent.com/AngerDark01/personal_skills/main/scripts/install.sh"

skills:

  # ── Code Development ──────────────────────────────────────────────────────

  - name: codebase-ontology
    category: code-development
    status: stable
    description: >
      Scans a project and builds/maintains a persistent CODEBASE.md ontology:
      module map, end-to-end data flows, key function index, call graph, and risk areas.
      Solves the AI context-window blind spot by providing a pre-digested global map.
    path: skills/code-development/codebase-ontology
    skill_file: skills/code-development/codebase-ontology/SKILL.md
    triggers:
      - "scan the project"
      - "build codebase map"
      - "initialize ontology"
      - "read the project"
      - "update the ontology"
      - "sync the map"
    tags:
      - code-analysis
      - documentation
      - architecture
      - onboarding
    install_cmd: "bash -s -- codebase-ontology"

  # ── Planning ──────────────────────────────────────────────────────────────

  - name: brainstorming
    category: planning
    status: stable
    description: >
      Hard-gates all implementation until a design is approved. Explores context,
      asks one clarifying question at a time, proposes 2-3 approaches with trade-offs,
      gains incremental approval, then documents the design and hands off to writing-plans.
      Prevents wasted effort from unexamined assumptions.
    path: skills/planning/brainstorming
    skill_file: skills/planning/brainstorming/SKILL.md
    triggers:
      - "let's plan this"
      - "I want to build"
      - "design this feature"
      - "let's think through"
      - "brainstorm"
    tags:
      - planning
      - design
      - architecture
      - workflow
    install_cmd: "bash -s -- brainstorming"

  - name: writing-plans
    category: planning
    status: stable
    description: >
      Breaks an approved design into atomic 2-5 minute implementation tasks following TDD.
      Each task includes exact file paths, complete code snippets, and precise verification
      commands. Produces a plan file in docs/plans/ and offers subagent or batch execution.
    path: skills/planning/writing-plans
    skill_file: skills/planning/writing-plans/SKILL.md
    triggers:
      - "write a plan"
      - "break this into tasks"
      - "create implementation plan"
    tags:
      - planning
      - tdd
      - workflow
    install_cmd: "bash -s -- writing-plans"

  - name: subagent-driven-development
    category: planning
    status: stable
    description: >
      Executes an implementation plan by dispatching a fresh subagent per task,
      followed by two-stage review (spec compliance then code quality) after each task.
      Produces high-quality reviewed code with fast iteration inside the current session.
    path: skills/planning/subagent-driven-development
    skill_file: skills/planning/subagent-driven-development/SKILL.md
    triggers:
      - "execute the plan with subagents"
      - "run subagent-driven dev"
      - "implement with subagents"
    tags:
      - planning
      - implementation
      - workflow
      - subagents
    install_cmd: "bash -s -- subagent-driven-development"

  - name: executing-plans
    category: planning
    status: stable
    description: >
      Batch execution of a written implementation plan with human review checkpoints
      between task groups. Alternative to subagent-driven-development for when you want
      explicit human-in-the-loop control in a separate session.
    path: skills/planning/executing-plans
    skill_file: skills/planning/executing-plans/SKILL.md
    triggers:
      - "execute this plan"
      - "run the plan"
      - "implement from the plan"
    tags:
      - planning
      - implementation
      - workflow
    install_cmd: "bash -s -- executing-plans"

  # ── Code Review ───────────────────────────────────────────────────────────

  - name: requesting-code-review
    category: code-review
    status: stable
    description: >
      Dispatches a code-reviewer subagent to catch issues before they cascade.
      Mandatory after each task in subagent-driven development, after major features,
