    install_cmd: "bash -s -- receiving-code-review"

  # ── Debugging ─────────────────────────────────────────────────────────────

  - name: systematic-debugging
    category: debugging
    status: stable
    description: >
      Four-phase mandatory debugging process: root cause investigation, pattern analysis,
      hypothesis testing, and implementation. Core rule: no fixes without root cause.
      After 3 failed fixes, question the architecture. Includes root-cause-tracing.md
      and defense-in-depth.md companion techniques.
    path: skills/debugging/systematic-debugging
    skill_file: skills/debugging/systematic-debugging/SKILL.md
    triggers:
