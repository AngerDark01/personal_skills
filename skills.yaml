      - "brainstorm"
    tags:
      - planning
      - design
      - architecture
      - workflow
    install_cmd: "bash -s -- brainstorming"

  - name: writing-plans
    category: planning
    status: stable
    description: >
      Breaks an approved design into atomic 2-5 minute implementation tasks following TDD.
      Each task includes exact file paths, complete code snippets, and precise verification
